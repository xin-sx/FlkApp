plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xinsx.flk'
    compileSdk 36

    defaultConfig {
        applicationId "com.xinsx.flk"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file('flk.keystore')
            storePassword 'flk123456'
            keyAlias 'flk'
            keyPassword 'flk123456'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
